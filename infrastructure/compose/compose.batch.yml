# Combinar con compose.distributed.yml usando -f en este orden.
services:
  batch_metadata:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: batch
      POSTGRES_PASSWORD: ${BATCH_DB_PASSWORD:-localbatch}
      POSTGRES_DB: batch
    volumes: [batch_metadata_pg:/var/lib/postgresql/data]
    networks: [messaging]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U batch -d batch"]
      interval: 5s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin123}
    volumes: [minio_data:/data]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    networks: [messaging]
  minio_init:
    image: minio/mc:RELEASE.2025-02-07T23-53-12Z
    entrypoint: /bin/sh
    command: -c 'until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done; mc mb --ignore-existing local/warehouse-platform-local'
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin123}
    depends_on: [minio]
    networks: [messaging]
  batch:
    build:
      context: ../../services
      dockerfile: batch/Dockerfile
    environment:
      WH001_DATABASE_URL: postgresql+psycopg2://admin:${DB_PASSWORD:-localdev}@wh001_db:5432/platform
      WH002_DATABASE_URL: postgresql+psycopg2://admin:${DB_PASSWORD:-localdev}@wh002_db:5432/platform
      WH003_DATABASE_URL: postgresql+psycopg2://admin:${DB_PASSWORD:-localdev}@wh003_db:5432/platform
      BATCH_DATABASE_URL: postgresql+psycopg2://batch:${BATCH_DB_PASSWORD:-localbatch}@batch_metadata:5432/batch
      AWS_ACCESS_KEY_ID: ${MINIO_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:-minioadmin123}
      AWS_DEFAULT_REGION: us-east-1
      S3_ENDPOINT_URL: http://minio:9000
      REPORT_BUCKET: warehouse-platform-local
    depends_on:
      wh001_db: {condition: service_healthy}
      wh002_db: {condition: service_healthy}
      wh003_db: {condition: service_healthy}
      batch_metadata: {condition: service_healthy}
      minio_init: {condition: service_completed_successfully}
    networks: [wh001, wh002, wh003, messaging]
  batch_report_api:
    build:
      context: ../../services
      dockerfile: batch/Dockerfile
    profiles: [storage]
    command: ["python", "-m", "batch.daily_report"]
    restart: "no"
    environment:
      WH001_API_URL: http://wh001_api:8000
      WH002_API_URL: http://wh002_api:8000
      WH003_API_URL: http://wh003_api:8000
      API_KEY: ${API_KEY:-dev-api-key}
      CENTRAL_API_URL: ${CENTRAL_API_URL:-}
      CENTRAL_API_KEY: ${CENTRAL_API_KEY:-}
      AWS_ACCESS_KEY_ID: ${MINIO_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:-minioadmin123}
      AWS_DEFAULT_REGION: us-east-1
      S3_ENDPOINT_URL: http://minio:9000
      REPORT_BUCKET: warehouse-platform-local
    depends_on:
      minio_init: {condition: service_completed_successfully}
    networks: [wh001, wh002, wh003, messaging]
volumes:
  batch_metadata_pg: {}
  minio_data: {}
