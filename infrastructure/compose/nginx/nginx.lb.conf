# nginx delante de las 3 réplicas de WH-002 (perfil `lb`, S-04). Ver ADR-0009.
# Distinto de nginx.conf (un único nombre `wh002_api` con --scale): aquí las réplicas
# son explícitas y el reparto, los reintentos y el log quedan visibles en la evidencia.
worker_processes auto;
events { worker_connections 1024; }
http {
  # Log JSON: una línea por petición con la réplica elegida y su estado.
  log_format json escape=json
    '{"time":"$time_iso8601","method":"$request_method","uri":"$request_uri",'
    '"status":$status,"request_time":$request_time,'
    '"upstream_addr":"$upstream_addr","upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time","correlation_id":"$http_x_correlation_id"}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;

  upstream wh002_pool {
    zone wh002_pool 64k;
    # DNS interno de Docker: las réplicas se resuelven en caliente (nginx arranca aunque falte una).
    resolver 127.0.0.11 valid=5s ipv6=off;
    # Round robin (por defecto). Detección pasiva: 2 fallos en 10 s sacan la réplica 10 s.
    server wh002_api_1:8000 resolve max_fails=2 fail_timeout=10s;
    server wh002_api_2:8000 resolve max_fails=2 fail_timeout=10s;
    server wh002_api_3:8000 resolve max_fails=2 fail_timeout=10s;
    keepalive 16;
  }
  server {
    listen 80;
    add_header X-Upstream $upstream_addr always;
    location / {
      proxy_pass http://wh002_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Correlation-ID $http_x_correlation_id;
      proxy_connect_timeout 1s;
      proxy_read_timeout 15s;
      # Reintenta en otra réplica ante error de conexión, timeout o 502/503 (solo métodos idempotentes).
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
    }
  }
}
