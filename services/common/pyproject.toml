[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse-common"
version = "0.1.0"
description = "Código compartido por los servicios: sobre de eventos, correlation ID, logs, RabbitMQ y storage"
requires-python = ">=3.12"
# Cada módulo agrega aquí lo que necesite (aio-pika, boto3...).
dependencies = [
    "pika>=1.3.2,<2",
    "pydantic>=2",
]

[tool.setuptools.packages.find]
include = ["common*"]