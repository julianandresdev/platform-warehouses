services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: src/
    container_name: api
    environment:
      DATABASE_URL: postgresql+psycopg2://admin:admin@db:5432/platform
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
