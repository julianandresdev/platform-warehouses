services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      # Selecciona infrastructure/sql/warehouse/seed/<WAREHOUSE_ID>.sql
      WAREHOUSE_ID: ${WAREHOUSE_ID:-WH-001}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # schema.sql, migrations/ y seed/ se aplican con init.sh al crear el volumen
      - ./infrastructure/sql/warehouse:/sql:ro
      - ./infrastructure/sql/warehouse/init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Solo caché: sin persistencia, se puede perder sin consecuencias.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: {context: ./services, dockerfile: warehouse-api/Dockerfile}
    environment:
      DATABASE_URL: postgresql+psycopg2://admin:admin@db:5432/platform
      WAREHOUSE_ID: ${WAREHOUSE_ID:-WH-001}
      API_KEY: ${API_KEY:-dev-api-key}
      REDIS_URL: redis://redis:6379/0
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-30}
      REDIS_TIMEOUT_SECONDS: ${REDIS_TIMEOUT_SECONDS:-0.2}
      CACHE_INVALIDATION: ${CACHE_INVALIDATION:-sync}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      # Redis solo se espera a que arranque: es opcional, la API responde sin él (fallback a PostgreSQL).
      redis:
        condition: service_started

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq-topology:
    build: {context: ./services, dockerfile: warehouse-api/Dockerfile}
    command: ["python", "-m", "common.topology"]
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: "no"


  # Carga: docker compose --profile load run --rm locust
  # Variables: LOAD_NAME (prefijo del CSV), LOAD_USERS, LOAD_TIME, LOAD_SCENARIO, LOAD_SKU.
  locust:
    image: locustio/locust:2.32.5
    profiles: ["load"]
    volumes:
      - ./tests/load:/mnt/locust:ro
      - ./docs/evidencias/fase-2:/results
    environment:
      API_KEY: ${API_KEY:-dev-api-key}
      LOAD_SKU: ${LOAD_SKU:-P-001}
      LOAD_WAIT: ${LOAD_WAIT:-0.05}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
    command: >
      -f /mnt/locust/locustfile.py --headless
      -u ${LOAD_USERS:-100} -r ${LOAD_USERS:-100} -t ${LOAD_TIME:-2m}
      --host http://api:8000 --csv /results/${LOAD_TAG:-.}/${LOAD_NAME:-run}
      ${LOAD_SCENARIO:-ReadSameSku}
    depends_on:
      - api

  outbox-worker:
    build: {context: ./services, dockerfile: warehouse-api/Dockerfile}
    command: ["python", "-m", "workers.outbox_relay"]
    environment:
      DATABASE_URL: postgresql+psycopg2://admin:admin@db:5432/platform
      WAREHOUSE_ID: ${WAREHOUSE_ID:-WH-001}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    restart: unless-stopped

  # Pasos de la Saga (F6): consume wh-00X.commands y responde por el outbox.
  commands-worker:
    build: {context: ./services, dockerfile: warehouse-api/Dockerfile}
    command: ["python", "-m", "workers.commands"]
    environment:
      DATABASE_URL: postgresql+psycopg2://admin:admin@db:5432/platform
      WAREHOUSE_ID: ${WAREHOUSE_ID:-WH-001}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Solo pruebas: <COMANDO>:before_commit|after_commit (ver workers/commands.py).
      CHAOS_FAIL_STEP: ${CHAOS_FAIL_STEP:-}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  cache-invalidation-worker:
    build: {context: ./services, dockerfile: warehouse-api/Dockerfile}
    command: ["python", "-m", "workers.cache_invalidation"]
    environment:
      WAREHOUSE_ID: ${WAREHOUSE_ID:-WH-001}
      REDIS_URL: redis://redis:6379/0
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_INVALIDATION: ${CACHE_INVALIDATION:-sync}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq-topology:
        condition: service_completed_successfully
    restart: unless-stopped

  reports-worker:
    build: {context: ./services, dockerfile: warehouse-api/Dockerfile}
    command: ["python", "-m", "workers.reports"]
    environment:
      DATABASE_URL: postgresql+psycopg2://admin:admin@db:5432/platform
      WAREHOUSE_ID: ${WAREHOUSE_ID:-WH-001}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # J-08 punto 6: con REPORTS_TO_S3=true el resultado también va a
      # reports/jobs/<job_id>.json en MinIO (profile `storage` levantado).
      REPORTS_TO_S3: ${REPORTS_TO_S3:-false}
      S3_ENDPOINT_URL: ${REPORTS_S3_ENDPOINT_URL:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-warehouse-platform}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq-topology:
        condition: service_completed_successfully
    restart: unless-stopped


  central-db:
    image: postgres:16
    environment:
      POSTGRES_DB: central
      POSTGRES_USER: central
      POSTGRES_PASSWORD: ${CENTRAL_DB_PASSWORD:-central_dev_password}
    volumes:
      - central_pgdata:/var/lib/postgresql/data
      - ./infrastructure/sql/central/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U central -d central"]
      interval: 5s
      timeout: 5s
      retries: 5

  central-api:
    build:
      context: ./services
      dockerfile: central/Dockerfile
    environment:
      DATABASE_URL: "postgresql+psycopg2://central:${CENTRAL_DB_PASSWORD:-central_dev_password}@central-db:5432/central"
      API_KEY: ${CENTRAL_API_KEY:-dev-central-key}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8004:8000"
    depends_on:
      central-db:
        condition: service_healthy


  central-worker:
    build:
      context: ./services
      dockerfile: central/Dockerfile
    command: ["python", "-m", "app.workers.main"]
    environment:
      DATABASE_URL: "postgresql+psycopg2://central:${CENTRAL_DB_PASSWORD:-central_dev_password}@central-db:5432/central"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      central-db:
        condition: service_healthy
    restart: unless-stopped

  # Almacenamiento S3 local (S-05). No arranca con `docker compose up`:
  #   docker compose --profile storage up -d
  # API S3 en 9000. El 9001 es el puerto de consola que pide el issue #26, pero esta
  # versión de MinIO no sirve la interfaz web ahí (comprobado): ver ADR-0011.
  minio:
    image: bitnamilegacy/minio:2025.7.23
    profiles: ["storage"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Crea el bucket y termina (restart: "no"). Es idempotente (--ignore-existing).
  minio-init:
    image: bitnamilegacy/minio-client:2025.7.21
    profiles: ["storage"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/$${S3_BUCKET}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-warehouse-platform}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  # Reporte diario (J-08): corre una vez y termina. Lee cada bodega por su API.
  #   docker compose --profile storage run --rm batch python -m batch.daily_report --date 2026-11-24
  # Este Compose solo tiene la bodega WH-001 (`api`); WH-002 y WH-003 se apuntan con
  # WH002_API_URL / WH003_API_URL (p. ej. a compose.distributed.yml vía host.docker.internal)
  # y, mientras no estén configuradas, el reporte sale PARTIAL.
  batch:
    build: {context: ./services, dockerfile: batch/Dockerfile}
    profiles: ["storage"]
    environment:
      WH001_API_URL: ${WH001_API_URL:-http://api:8000}
      WH002_API_URL: ${WH002_API_URL:-}
      WH003_API_URL: ${WH003_API_URL:-}
      API_KEY: ${API_KEY:-dev-api-key}
      CENTRAL_API_URL: ${CENTRAL_API_URL:-http://central-api:8000}
      CENTRAL_API_KEY: ${CENTRAL_API_KEY:-dev-central-key}
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-warehouse-platform}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      minio-init:
        condition: service_completed_successfully
      central-api:
        condition: service_started
    restart: "no"

  central-audit-worker:
    build:
      context: ./services
      dockerfile: central/Dockerfile
    command: ["python", "-m", "app.workers.audit"]
    environment:
      DATABASE_URL: "postgresql+psycopg2://central:${CENTRAL_DB_PASSWORD:-central_dev_password}@central-db:5432/central"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      central-db:
        condition: service_healthy
      rabbitmq-topology:
        condition: service_completed_successfully
    restart: unless-stopped

  # Fase 12 (D-07): sensores MQTT y procesamiento duradero.
  mosquitto:
    image: eclipse-mosquitto:2
    profiles: ["iot"]
    ports:
      - "${MQTT_HOST_PORT:-1883}:1883"
    volumes:
      - ./services/iot/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -t healthcheck -m ok -q 1"]
      interval: 5s
      timeout: 4s
      retries: 10

  iot-db:
    image: postgres:16
    profiles: ["iot"]
    environment:
      POSTGRES_DB: iot
      POSTGRES_USER: iot
      POSTGRES_PASSWORD: ${IOT_DB_PASSWORD:-iot_dev_password}
    volumes:
      - iot_pgdata:/var/lib/postgresql/data
      - ./infrastructure/sql/iot/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot -d iot"]
      interval: 5s
      timeout: 4s
      retries: 10

  iot-ingestion:
    build: {context: ./services, dockerfile: iot/Dockerfile}
    command: ["python", "-m", "app.ingestion"]
    profiles: ["iot"]
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports: ["127.0.0.1:19103:9103"]
    depends_on:
      mosquitto:
        condition: service_healthy
      rabbitmq-topology:
        condition: service_completed_successfully
    restart: unless-stopped

  iot-storage-worker:
    build: {context: ./services, dockerfile: iot/Dockerfile}
    command: ["python", "-m", "app.storage"]
    profiles: ["iot"]
    environment:
      DATABASE_URL: postgresql+psycopg2://iot:${IOT_DB_PASSWORD:-iot_dev_password}@iot-db:5432/iot
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports: ["127.0.0.1:19104:9104"]
    depends_on:
      iot-db:
        condition: service_healthy
      rabbitmq-topology:
        condition: service_completed_successfully
    restart: unless-stopped

  iot-alert-worker:
    build: {context: ./services, dockerfile: iot/Dockerfile}
    command: ["python", "-m", "app.alerts"]
    profiles: ["iot"]
    environment:
      DATABASE_URL: postgresql+psycopg2://iot:${IOT_DB_PASSWORD:-iot_dev_password}@iot-db:5432/iot
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      TEMPERATURE_THRESHOLD: ${TEMPERATURE_THRESHOLD:-35}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports: ["127.0.0.1:19105:9105"]
    depends_on:
      iot-db:
        condition: service_healthy
      rabbitmq-topology:
        condition: service_completed_successfully
    restart: unless-stopped

  iot-simulator:
    build: {context: ./services, dockerfile: iot/Dockerfile}
    command: ["python", "-m", "app.simulator"]
    profiles: ["iot"]
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      SENSOR_COUNT: ${SENSOR_COUNT:-100}
      WAREHOUSE_IDS: ${IOT_WAREHOUSE_IDS:-WH-001,WH-002,WH-003,WH-004,WH-005}
      PUBLISH_INTERVAL_SECONDS: ${PUBLISH_INTERVAL_SECONDS:-2}
      SIM_DURATION_SECONDS: ${SIM_DURATION_SECONDS:-600}
      DUP_RATE: ${DUP_RATE:-0.02}
      REORDER_RATE: ${REORDER_RATE:-0.05}
      SIMULATED_OUTAGE_START_SECONDS: ${SIMULATED_OUTAGE_START_SECONDS:-60}
      SIMULATED_OUTAGE_DURATION_SECONDS: ${SIMULATED_OUTAGE_DURATION_SECONDS:-20}
      SPOOL_PATH: /var/lib/iot-spool/spool.sqlite3
      SIMULATOR_SUMMARY_PATH: /evidence/simulacion-10min.json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports: ["127.0.0.1:19102:9102"]
    volumes:
      - iot_spool:/var/lib/iot-spool
      - ./docs/evidencias/fase-12:/evidence
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: "no"

volumes:
  central_pgdata: {}
  pgdata: {}
  rabbitmq_data: {}
  minio_data: {}
  mosquitto_data: {}
  iot_pgdata: {}
  iot_spool: {}
