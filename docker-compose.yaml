services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      # Selecciona infrastructure/sql/warehouse/seed/<WAREHOUSE_ID>.sql
      WAREHOUSE_ID: ${WAREHOUSE_ID:-WH-001}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # schema.sql, migrations/ y seed/ se aplican con init.sh al crear el volumen
      - ./infrastructure/sql/warehouse:/sql:ro
      - ./infrastructure/sql/warehouse/init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Solo caché: sin persistencia, se puede perder sin consecuencias.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: {context: ./services, dockerfile: warehouse-api/Dockerfile}
    environment:
      DATABASE_URL: postgresql+psycopg2://admin:admin@db:5432/platform
      WAREHOUSE_ID: ${WAREHOUSE_ID:-WH-001}
      API_KEY: ${API_KEY:-dev-api-key}
      REDIS_URL: redis://redis:6379/0
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-30}
      REDIS_TIMEOUT_SECONDS: ${REDIS_TIMEOUT_SECONDS:-0.2}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      # Redis solo se espera a que arranque: es opcional, la API responde sin él (fallback a PostgreSQL).
      redis:
        condition: service_started

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq-topology:
    build: {context: ./services, dockerfile: warehouse-api/Dockerfile}
    command: ["python", "-m", "common.topology"]
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: "no"


  # Carga: docker compose --profile load run --rm locust
  # Variables: LOAD_NAME (prefijo del CSV), LOAD_USERS, LOAD_TIME, LOAD_SCENARIO, LOAD_SKU.
  locust:
    image: locustio/locust:2.32.5
    profiles: ["load"]
    volumes:
      - ./tests/load:/mnt/locust:ro
      - ./docs/evidencias/fase-2:/results
    environment:
      API_KEY: ${API_KEY:-dev-api-key}
      LOAD_SKU: ${LOAD_SKU:-P-001}
      LOAD_WAIT: ${LOAD_WAIT:-0.05}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
    command: >
      -f /mnt/locust/locustfile.py --headless
      -u ${LOAD_USERS:-100} -r ${LOAD_USERS:-100} -t ${LOAD_TIME:-2m}
      --host http://api:8000 --csv /results/${LOAD_TAG:-.}/${LOAD_NAME:-run}
      ${LOAD_SCENARIO:-ReadSameSku}
    depends_on:
      - api

  outbox-worker:
    build: {context: ./services, dockerfile: warehouse-api/Dockerfile}
    command: ["python", "-m", "workers.outbox_relay"]
    environment:
      DATABASE_URL: postgresql+psycopg2://admin:admin@db:5432/platform
      WAREHOUSE_ID: ${WAREHOUSE_ID:-WH-001}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    restart: unless-stopped

  # Pasos de la Saga (F6): consume wh-00X.commands y responde por el outbox.
  commands-worker:
    build: {context: ./services, dockerfile: warehouse-api/Dockerfile}
    command: ["python", "-m", "workers.commands"]
    environment:
      DATABASE_URL: postgresql+psycopg2://admin:admin@db:5432/platform
      WAREHOUSE_ID: ${WAREHOUSE_ID:-WH-001}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Solo pruebas: <COMANDO>:before_commit|after_commit (ver workers/commands.py).
      CHAOS_FAIL_STEP: ${CHAOS_FAIL_STEP:-}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped


  central-db:
    image: postgres:16
    environment:
      POSTGRES_DB: central
      POSTGRES_USER: central
      POSTGRES_PASSWORD: ${CENTRAL_DB_PASSWORD:-central_dev_password}
    volumes:
      - central_pgdata:/var/lib/postgresql/data
      - ./infrastructure/sql/central/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U central -d central"]
      interval: 5s
      timeout: 5s
      retries: 5

  central-api:
    build:
      context: ./services
      dockerfile: central/Dockerfile
    environment:
      DATABASE_URL: "postgresql+psycopg2://central:${CENTRAL_DB_PASSWORD:-central_dev_password}@central-db:5432/central"
      API_KEY: ${CENTRAL_API_KEY:-dev-central-key}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8004:8000"
    depends_on:
      central-db:
        condition: service_healthy


  central-worker:
    build:
      context: ./services
      dockerfile: central/Dockerfile
    command: ["python", "-m", "app.workers.main"]
    environment:
      DATABASE_URL: "postgresql+psycopg2://central:${CENTRAL_DB_PASSWORD:-central_dev_password}@central-db:5432/central"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      central-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  central_pgdata: {}
  pgdata: {}
  rabbitmq_data: {}
